opinie:
  - autor: "Ewa Rubinkiewicz"
    tresc: "Cudowne miejsce na słodką przerwę! W Się Upiekło na Woli wszystko jest przepyszne. Cynamonki miękkie, świeże i pełne smaku."
  - autor: "Nadiia Kryshtof"
    tresc: "Próbowaliśmy tortu tiramisu na urodzinach u znajomych i bardzo nam smakował. Był lekki, świeży i przepyszny. Na pewno jeszcze skorzystamy."
  - autor: "Justyna Lubiak"
    tresc: "Zamawiałam tort na ostatnią sobotę — jestem zadowolona i mogę szczerze polecić to miejsce."

